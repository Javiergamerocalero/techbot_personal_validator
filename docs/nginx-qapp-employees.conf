# Server block para el Qapp Employee Validation Service.
# Comparte el VPS con el backend de visión IA (puerto 8000 directo).
# Acá exponemos:
#  - /admin/empleados/   → SPA buildeada del frontend
#  - /api/v1/employees   → backend en 127.0.0.1:8001
#  - /api/v1/tenants     → backend en 127.0.0.1:8001
#  - /api/v1/health      → backend en 127.0.0.1:8001
#
# Cuando Javier asigne un subdominio (api.empleados.example.com),
# duplicamos este bloque con server_name = ese dominio + certbot.

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;  # Excel files

    # Frontend buildeado por Vite — copiado a /var/www/ porque
    # nginx (www-data) no puede entrar al home de techbot.
    # Actualización: cada vez que se haga rebuild del front, copiar
    # `frontend/dist/*` a `/var/www/qapp-empleados/`.
    location /admin/empleados/ {
        alias /var/www/qapp-empleados/;
        try_files $uri $uri/ /admin/empleados/index.html;
    }

    # Backend
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Headers de auth que Qapp y la UI necesitan que lleguen al
        # backend tal cual los manda el cliente.
        proxy_pass_request_headers on;

        # El parser de Excel puede tardar con archivos grandes.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
